version: '3.8'

services:
  ovis-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ovis-dev
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./ovis-api:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - W:/ovis_save:/nas-mount
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///data/ovis.db
      - LOG_LEVEL=debug
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - ovis-network

networks:
  ovis-network:
    driver: bridge 