version: '3.8'

services:
  ovis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ovis-app
    restart: unless-stopped
    ports:
      - "528:528"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      -  W:/ovis_save:/nas-mount
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/ovis.db
      - LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:528/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ovis-network

  # Nginx 프록시 설정
  nginx:
    image: nginx:alpine
    container_name: ovis-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ovis-core/build:/usr/share/nginx/html:ro
    depends_on:
      ovis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ovis-network

networks:
  ovis-network:
    driver: bridge

volumes:
  data:
    driver: local
  nas-mount:
    driver: local 