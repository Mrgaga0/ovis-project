version: '3.8'

services:
  ovis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ovis-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./ovis-api:/app
      - W:/ovis_save:/nas-mount
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///data/ovis.db
      - LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ovis-network

  # 프론트엔드 서비스 설정
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ovis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - ovis
    networks:
      - ovis-network
    environment:
      - REACT_APP_API_URL=http://ovis-app:3002

  # Nginx 프록시 설정 - 프론트와 백엔드 통합
  nginx:
    image: nginx:alpine
    container_name: ovis-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ovis
      - frontend
    networks:
      - ovis-network

networks:
  ovis-network:
    driver: bridge

volumes:
  data:
    driver: local
  nas-mount:
    driver: local 