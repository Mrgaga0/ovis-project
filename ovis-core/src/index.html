<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
  <title>OVIS - 개인화 AI 에이전트 시스템</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #f0f2f5;
    }
    
    #root {
      height: 100%;
      width: 100%;
    }
    
    /* 로딩 표시기 */
    .app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      background-color: #f0f2f5;
      flex-direction: column;
    }
    
    .app-loading__logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    
    .app-loading__text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      color: #1890ff;
      text-align: center;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- 초기 로딩 화면 -->
    <div class="app-loading">
      <div class="app-loading__logo">
        <!-- 로고 자리 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
          <circle cx="50" cy="50" r="45" fill="#1890ff" opacity="0.8" />
          <text x="50" y="60" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="32">OVIS</text>
        </svg>
      </div>
      <div class="app-loading__text">
        OVIS 시스템을 초기화하는 중...
      </div>
    </div>
  </div>
</body>
</html>
